name: Application CI
on: [push, pull_request]
jobs:
  client-tests:
    name: Client unit tests (Node 14, dockerized)
    runs-on: ubuntu-latest
    # The client is pinned to Node 14 (node-sass@6 / jest-preset-angular do not
    # run on newer Node), so the Jest suite runs inside the matching Node 14
    # container image rather than relying on the runner's Node toolchain.
    container:
      image: node:14.21.3
    if: "!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.pull_request.title, '[skip ci]') && !contains(github.event.pull_request.title, '[ci skip]')"
    timeout-minutes: 30
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
      JHI_DISABLE_WEBPACK_LOGS: true
      NG_CLI_ANALYTICS: false
      CI: 'true'
    steps:
      - uses: actions/checkout@v2

      - name: Install node.js packages
        run: npm install

      - name: Run client unit tests
        run: npm run jest

  pipeline:
    name: ERP Client pipeline
    runs-on: ubuntu-latest
    needs: client-tests
    if: "!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.pull_request.title, '[skip ci]') && !contains(github.event.pull_request.title, '[ci skip]')"
    timeout-minutes: 40
    env:
      NODE_VERSION: 14.15.0
      NODE_OPTIONS: '--max-old-space-size=8192'
      JHI_DISABLE_WEBPACK_LOGS: true
      NG_CLI_ANALYTICS: false
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: 14.15.0

      - name: Install node.js packages
        run: npm install

      - name: Package application
        run: npm run webapp:build:prod

      - name: Login to Docker hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build docker image
        run: docker build . --file Dockerfile --tag ${{ secrets.DOCKERHUB_ORG }}/${{ secrets.DOCKERHUB_REPO }}:1.7.8

      - name: Push docker image
        run: docker push ${{ secrets.DOCKERHUB_ORG }}/${{ secrets.DOCKERHUB_REPO }}:1.7.8
