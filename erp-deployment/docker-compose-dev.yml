version: '3.3'

networks:
  erp-system-dev-network:
    driver: bridge

services:
  zookeeper-dev:
    image: confluentinc/cp-zookeeper:5.5.5
    volumes:
      - ./zookeeper-dev-data:/var/lib/zookeeper/data
      - ./zookeeper-dev-logs:/var/lib/zookeeper/log
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    ports:
      - 2182:2181
    networks:
      - erp-system-dev-network

  kafka-dev:
    image: confluentinc/cp-kafka:5.5.5
    ports:
      - 9870:9092
      - 29093:29092
    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: DOCKER_INTERNAL:PLAINTEXT,DOCKER_EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: DOCKER_INTERNAL://:29092,DOCKER_EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: DOCKER_INTERNAL://kafka-dev:29092,DOCKER_EXTERNAL://${DOCKER_HOST_IP:-localhost}:9870
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER_INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper-dev:2181"
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper-dev
    volumes:
      - ./kafka-dev-queue:/var/lib/kafka/data
    networks:
      - erp-system-dev-network

  jhipster-registry-dev:
    image: jhipster/jhipster-registry:v7.3.0
    volumes:
      - ./central-server-dev-config:/central-config
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=dev,api-docs
      - SPRING_SECURITY_USER_PASSWORD=admin
      - JHIPSTER_REGISTRY_PASSWORD=admin
      - SPRING_CLOUD_CONFIG_SERVER_COMPOSITE_0_TYPE=native
      - SPRING_CLOUD_CONFIG_SERVER_COMPOSITE_0_SEARCH_LOCATIONS=file:/central-config/localhost-config/
    ports:
      - 8771:8761
    networks:
      - erp-system-dev-network

  erpsystem-elasticsearch-dev:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.13.4
    volumes:
      - ./search-index-dev-directory:/usr/share/elasticsearch/data
    ports:
      - 8840:9200
      - 8841:9300
    environment:
      - "discovery.type=single-node"
      - "ES_JAVA_OPTS=-Xms2048m -Xmx2048m"
      - "cluster.max_shards_per_node=3000"
      - "xpack.security.enabled=true"
      - "xpack.security.transport.ssl.enabled=false"
      - "ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}"
      - "ELASTIC_USERNAME=${ELASTIC_USERNAME}"
    networks:
      - erp-system-dev-network

  erp-system-server-dev:
    image: ghacupha/erp-system:1.8.3
    volumes:
      - ../erp-system/logs:/logs
      - ../erp-system/reports-directory:/reports-directory
      - ../erp-system/generated-reports:/generated-reports
      - ../erp-system/business-documents:/business-documents
    environment:
      - _JAVA_OPTIONS=-Xmx2048m -XX:MaxRAMPercentage=50.0 -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
      - SPRING_PROFILES_ACTIVE=dev,api-docs
      - MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED=true
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://admin:admin@jhipster-registry-dev:8761/eureka
      - SPRING_CLOUD_CONFIG_URI=http://admin:admin@jhipster-registry-dev:8761/config
      - SPRING_DATASOURCE_URL=${LOCAL_PG_SERVER}/${ERP_SYSTEM_DEV_DB}
      - SPRING_LIQUIBASE_URL=${LOCAL_PG_SERVER}/${ERP_SYSTEM_DEV_DB}
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka-dev:29092
      - KAFKA_BOOTSTRAPSERVERS=kafka-dev:29092
      - SPRING_ELASTICSEARCH_REST_URIS=http://erpsystem-elasticsearch-dev:9200
      - SPRING_ELASTICSEARCH_REST_USERNAME=elastic
      - SPRING_ELASTICSEARCH_REST_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - ERP_SYSTEM_DEV_DB=${ERP_SYSTEM_DEV_DB}
      - ERP_SYSTEM_DEV_PORT=${ERP_SYSTEM_DEV_PORT}
      - ERP_SYSTEM_DEV_MAIL_BASE_URL=${ERP_SYSTEM_DEV_MAIL_BASE_URL}
      - SECURITY_AUTHENTICATION_JWT_BASE64_SECRET=${SECURITY_AUTHENTICATION_JWT_BASE64_SECRET}
      - UPLOADS_SIZE=${UPLOADS_SIZE}
      - SANDBOX_INSTANCE_URLS=${SANDBOX_INSTANCE_URLS}
      - ERP_REINDEXER_INTERVAL=${ERP_REINDEXER_INTERVAL_DEV}
      - ERP_DOCUMENTS_MAX_FILE_SIZE=${ERP_DOCUMENTS_MAX_FILE_SIZE}
      - ERP_CACHE_REBUILD_ENABLED=${ERP_CACHE_REBUILD_ENABLED}
      - ERP_CACHE_TEARDOWN_REBUILD_ENABLED=${ERP_CACHE_TEARDOWN_REBUILD_ENABLED}
      - ERP_INDEX_ENABLED=${ERP_INDEX_ENABLED}
      - ERP_INDEX_REBUILD_ENABLED=${ERP_INDEX_REBUILD_ENABLED}
      - SERVER_PORT=${ERP_SYSTEM_DEV_PORT}
      - JHIPSTER_SLEEP=30
    ports:
      - "${ERP_SYSTEM_DEV_PORT}:${ERP_SYSTEM_DEV_PORT}"
    depends_on:
      - kafka-dev
      - erpsystem-elasticsearch-dev
      - jhipster-registry-dev
    networks:
      - erp-system-dev-network

  erp-client-web-dev:
    build:
      context: ../erp-client
      dockerfile: Dockerfile.dev
    environment:
      - SERVER_API_URL=${SERVER_API_URL}
      - SERVER_API_URL_URL=${SERVER_API_URL_URL}
      - SERVER_API_WS_URL=${SERVER_API_WS_URL}
      - SERVER_API_DOCKER_DEPLOY_HOST=http://erp-system-server-dev
      - SERVER_API_DOCKER_DEPLOY_PORT=${ERP_SYSTEM_DEV_PORT}
      - ERP_SYSTEM_DEV_PORT=${ERP_SYSTEM_DEV_PORT}
      - ERP_CLIENT_DEV_PORT=${ERP_CLIENT_DEV_PORT}
      - ERP_CLIENT_DEPLOYMENT_PROD_PORT=${ERP_CLIENT_DEV_PORT}
    ports:
      - "${ERP_CLIENT_DEV_PORT}:80"
    depends_on:
      - erp-system-server-dev
    networks:
      - erp-system-dev-network
